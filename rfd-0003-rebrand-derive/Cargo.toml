# `#[derive(Rebrand)]` for `rfd-0003-brand-erasure`. A proc macro needs a
# crate of its own, which no target of the root package can be, so it is a
# workspace member; see the README.
[package]
name = "rfd-0003-rebrand-derive"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
proc-macro = true

# The versions `bough-derive` uses.
[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# `views` also emits `Borrow` and `BorrowMut`, with a `FooRef` and `FooMut`,
# for `rfd-0003-brand-erasure -- borrow`. Off by default, so the `derive`
# mode's Bough, which has neither trait, gets what it always got.
[features]
views = []
# `trace` also exports `#[derive(Trace)]` and refuses a `#[rebrand(skip)]`
# field that may hold a token, in both derives; `seal` and `unsafe-seal` make
# the `Rebrand` derive also implement a seal, `unsafe` for the second, under
# `#[allow(unsafe_code)]` unless `bare-unsafe` is on too. All four are for
# `rfd-0003-brand-erasure -- trace`, and off by default so the other modes get
# what they always got.
trace = []
seal = []
unsafe-seal = []
bare-unsafe = ["unsafe-seal"]
# `bare-unsafe-views` makes the `Borrow` and `BorrowMut` impls `views` writes
# `unsafe impl`, with no `allow`, for `rfd-0003-brand-erasure -- entry`, whose
# Bough makes both traits `unsafe` under `--cfg bough_seal_views`.
bare-unsafe-views = ["views"]
